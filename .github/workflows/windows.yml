name: Windows client

on:
  pull_request:
    paths: ["platforms/windows/**", "core/**", ".github/workflows/windows.yml"]
  push:
    branches: ["docs/windows-handoff"]
    paths: ["platforms/windows/**", "core/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.24.x", cache-dependency-path: core/go.sum }
      - name: Test core
        working-directory: core
        run: go test ./...
      - name: Restore locked Windows dependencies
        run: dotnet restore platforms/windows/Bren.Windows.sln
      - name: Test Windows transport and state machine
        if: matrix.rid == 'win-x64'
        run: dotnet test platforms/windows/Bren.Windows.sln -c Release -p:Platform=x64 --no-restore
      - name: Build matching native core
        shell: pwsh
        run: ./platforms/windows/scripts/Build-Core.ps1 -RuntimeIdentifier ${{ matrix.rid }}
      - name: Verify native core architecture
        shell: pwsh
        run: ./platforms/windows/scripts/Verify-PeMachine.ps1 -Path ./platforms/windows/src/Bren.App/Helpers/bren-core.exe -RuntimeIdentifier ${{ matrix.rid }}
      - name: Publish self-contained client
        run: dotnet publish platforms/windows/src/Bren.App/Bren.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --no-restore -o artifacts/${{ matrix.rid }}/publish
