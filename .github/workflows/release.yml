name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: make test

      - name: Build signed update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          build="$((1000 + GITHUB_RUN_NUMBER))"
          ./scripts/release-macos.sh "$version" "$build"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/updates/Bren-$version.zip" \
            "dist/updates/appcast.xml" \
            --title "Bren $version" \
            --notes-file "docs/releases/$version.md" \
            --verify-tag
