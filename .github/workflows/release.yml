name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-go@v7
        with: { go-version: "1.24", cache: false }
      - name: Test
        run: make test
      - name: Build signed update
        env: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }
        run: |
          version="${GITHUB_REF_NAME#v}"
          build="$((1000 + GITHUB_RUN_NUMBER))"
          ./scripts/release-macos.sh "$version" "$build"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: |
            dist/updates/Bren-*.zip
            dist/updates/appcast.xml
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.24.x", cache-dependency-path: core/go.sum }
      - name: Test native core
        working-directory: core
        run: go test ./...
      - name: Restore and test Windows client
        shell: pwsh
        run: |
          dotnet restore platforms/windows/Bren.Windows.sln
          if ('${{ matrix.rid }}' -eq 'win-x64') { dotnet test platforms/windows/Bren.Windows.sln -c Release -p:Platform=x64 --no-restore }
      - name: Build matching native core
        shell: pwsh
        run: ./platforms/windows/scripts/Build-Core.ps1 -RuntimeIdentifier ${{ matrix.rid }}
      - name: Verify native core architecture
        shell: pwsh
        run: ./platforms/windows/scripts/Verify-PeMachine.ps1 -Path ./platforms/windows/src/Bren.App/Helpers/bren-core.exe -RuntimeIdentifier ${{ matrix.rid }}
      - name: Publish self-contained WinUI client
        run: dotnet publish platforms/windows/src/Bren.App/Bren.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --no-restore -o artifacts/${{ matrix.rid }}/publish
      - name: Verify published helper architecture
        shell: pwsh
        run: ./platforms/windows/scripts/Verify-PeMachine.ps1 -Path ./artifacts/${{ matrix.rid }}/publish/Helpers/bren-core.exe -RuntimeIdentifier ${{ matrix.rid }}
      - name: Package architecture-specific updater channel
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          dotnet tool install --tool-path .tools vpk --version 1.2.0
          ./.tools/vpk pack --packId Bren --packVersion $version --packDir ./artifacts/${{ matrix.rid }}/publish --mainExe Bren.App.exe --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --packTitle Bren --packAuthors WilletJiang --shortcuts StartMenuRoot --outputDir ./artifacts/${{ matrix.rid }}/release
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.rid }}-release
          path: artifacts/${{ matrix.rid }}/release
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { path: release-assets, merge-multiple: true }
      - name: Publish one GitHub Release with macOS and Windows assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Bren ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --verify-tag
